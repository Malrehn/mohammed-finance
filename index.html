<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدير محمد المالي V6</title>
<style>
body{font-family:Arial;background:#f4f6f8;max-width:1200px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select,button{width:100%;padding:8px;margin:4px 0}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
 
 .logo{
text-align:center;
font-size:42px;
font-weight:900;
letter-spacing:4px;
margin:20px 0;
color:#1f2937;
.toolbar{
display:flex;
justify-content:center;
gap:12px;
margin-top:15px;
flex-wrap:wrap;
direction:rtl;
}
.tool-btn{
width:170px;
height:210px;
border:none;
border-radius:22px;
color:white;
font-size:32px;
font-weight:bold;
cursor:pointer;
transition:.3s;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:15px;
box-shadow:0 8px 20px rgba(0,0,0,.25);
}
.tool-btn:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.18);
}
.save{background:#22c55e;color:white;}
.delete{background:#ef4444;color:white;}
.print{background:#3b82f6;color:white;}
.report{background:#8b5cf6;color:white;}
.reset{background:#f59e0b;color:white;}
 .add{background:#16a34a;color:white;}
#savingChart{
    display:block;
    width:100% !important;
    max-width:900px;
    margin:20px auto !important;
}

.card{
    text-align:center;
}

.chart-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}
</style>
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1 class="logo">MALREHN</h1>
<div class="grid">
<div class="card">💰 المتبقي<br><b id="remain">0</b></div>
<div class="card">🏦 نهاية الشهر<br><b id="endbal">0</b></div>
<div class="card">🎯 الادخار السنوي<br><b id="annual">0</b></div>
<div class="card">🚦 الحالة<br><b id="status">-</b></div>
 <div class="card">🏦 القرض المتبقي<br><b id="loanRemain">19752</b></div>
<div class="card">✅ المسدد<br><b id="loanPaid">0</b></div>
<div class="card">📈 الإنجاز<br><b id="loanProgress">0%</b></div>
</div>
<div class="card">
<h3>⚙️ الإعدادات</h3>
<input id="salary" type="number" value="5900" placeholder="الراتب">
<input id="maid" type="number" value="1000" placeholder="راتب العاملة">
<select id="year">
<option>2026</option><option>2027</option><option>2028</option><option>2029</option>
</select>
</div>
<div class="card">
<h3>📅 بيانات الشهر</h3>
<select id="month"></select>
<input id="startBalance" type="number" placeholder="🏦 رصيد بداية الشهر">
<input id="commission" type="number" placeholder="💰 العمولة">
<input id="commitments" type="number" placeholder="💳 الالتزامات الشهرية">
<input id="education" type="number" placeholder="🎓 التعليم">
<input id="fuel" type="number" placeholder="⛽ البنزين">
<input id="groceries" type="number" placeholder="🛒 المقاضي">
<input id="restaurants" type="number" placeholder="🍔 المطاعم">
<input id="other" type="number" placeholder="📦 أخرى">
<input id="extraLoan" type="number" placeholder="🏦 مبلغ سداد القرض">
<input id="saving" type="number" placeholder="🎯 الادخار">
<div class="toolbar">
<button class="tool-btn save"
onclick="saveMonth()"
title="حفظ">
💾<br>حفظ
</button>
<button class="tool-btn add"
onclick="addValues()"
title="إضافة مبلغ">
➕<br>إضافة
</button>
<button class="tool-btn delete"
onclick="deleteMonth()"
title="حذف الشهر">
🗑️<br>حذف الشهر
</button>
<button class="tool-btn print"
onclick="printReport()"
title="طباعة">
🖨️<br>تقرير الشهر
</button>
<button class="tool-btn report"
onclick="printYearReport()"
title="التقرير السنوي">
📊<br>التقرير السنوي
</button>
<button class="tool-btn reset"
onclick="resetYear()"
title="إعادة تعيين">
🔄<br>إعادة تعيين السنة
</button>
<button onclick="exportBackup()">💾 تصدير نسخة احتياطية</button>
</div>
<div id="msg"></div>
<div class="card">
<h3>📋 السجل السنوي</h3>
<div class="chart-container">
  <canvas id="savingChart" height="120"></canvas>
</div>
<table>
<thead><tr><th>الشهر</th><th>العمولة</th><th>الالتزامات</th><th>الادخار</th><th>القرض</th></tr></thead>
<tbody id="tbl"></tbody>
</table>
</div>
<script>
const months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
 let savingChart;
months.forEach(m=>month.add(new Option(m,m)));
month.value=months[new Date().getMonth()];
function key(){return year.value+"_"+month.value;}
function saveMonth(){
const d = JSON.parse(localStorage.getItem(key()) || "{}");
 d.startBalance = +startBalance.value || d.startBalance || 0;
d.commission   = +commission.value   || d.commission   || 0;
d.commitments  = +commitments.value  || d.commitments  || 0;
d.education    = +education.value    || d.education    || 0;
d.fuel         = +fuel.value         || d.fuel         || 0;
d.groceries    = +groceries.value    || d.groceries    || 0;
d.restaurants  = +restaurants.value  || d.restaurants  || 0;
d.other        = +other.value        || d.other        || 0;
d.extraLoan    = +extraLoan.value    || d.extraLoan    || 0;
d.saving       = +saving.value       || d.saving       || 0;
d.updated      = new Date().toLocaleString();
 localStorage.setItem(key(),JSON.stringify(d));
 msg.innerHTML="✅ تم الحفظ بنجاح";
["commission","commitments","education","fuel","groceries","restaurants","other","extraLoan","saving"].forEach(x=>{
document.getElementById(x).value="";
});
 refresh();
}
function deleteMonth(){
 localStorage.removeItem(key());
 loadMonth(); refresh();
}
 function exportBackup() {
  const data = {};
  for(let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    data[key] = localStorage.getItem(key);
  }
  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "malrehn-backup.json";
  a.click();
}
 function addValues(){
let d = JSON.parse(localStorage.getItem(key()) || "{}");
d.commission  = (d.commission  || 0) + (+commission.value  || 0);
d.commitments = (d.commitments || 0) + (+commitments.value || 0);
d.education   = (d.education   || 0) + (+education.value   || 0);
d.fuel        = (d.fuel        || 0) + (+fuel.value        || 0);
d.groceries   = (d.groceries   || 0) + (+groceries.value   || 0);
d.restaurants = (d.restaurants || 0) + (+restaurants.value || 0);
d.other       = (d.other       || 0) + (+other.value       || 0);
d.extraLoan   = (d.extraLoan   || 0) + (+extraLoan.value   || 0);
d.saving = (d.saving || 0) + (+saving.value || 0);
d.updated = new Date().toLocaleString();
localStorage.setItem(key(), JSON.stringify(d));
loadMonth();
refresh();
msg.innerHTML="➕ تمت الإضافة بنجاح";}
loadMonth();
 month.onchange=loadMonth;
year.onchange=loadMonth;
 function drawChart(data){

const ctx=document.getElementById("savingChart");

if(!ctx) return;

if(savingChart){
savingChart.destroy();
}
savingChart=new Chart(ctx,{
type:"line",
data:{
labels:months,
datasets:[{
label:"الادخار الشهري",
data:data,
borderWidth:3,
tension:0.4
}]
},

});

}
function loadMonth(){
 let d=JSON.parse(localStorage.getItem(key())||"{}");
["startBalance","commission","commitments","education","fuel","groceries","restaurants","other","extraLoan","saving"].forEach(x=>{
 if(d[x]!=null) document.getElementById(x).value=d[x];
});
 refresh();
}
function refresh(){
let annualSave = 0, rows = "";
const status = document.getElementById("status");
 let chartData=[];
months.forEach(m => {
 let d = JSON.parse(localStorage.getItem(year.value + "_" + m) || "{}");
 annualSave += (+d.saving || 0);
 chartData.push(+d.saving || 0);
 rows += `<tr>
<td>${m}</td>
<td>${d.commission || 0}</td>
<td>${d.commitments || 0}</td>
<td>${d.saving || 0}</td>
<td>${d.extraLoan || 0}</td>
</tr>`;
});
tbl.innerHTML = rows;
annual.innerText = annualSave;
 tbl.innerHTML=rows;
 annual.innerText=annualSave;
 drawChart(chartData);
 let d = JSON.parse(localStorage.getItem(key()) || "{}");
let income = (+salary.value || 0) + (+d.commission || 0);
let expenses =
(+maid.value || 0) +
(+d.commitments || 0) +
(+d.education || 0) +
(+d.fuel || 0) +
(+d.groceries || 0) +
(+d.restaurants || 0) +
(+d.other || 0) +
(+d.extraLoan || 0);
let rem = income - expenses;
remain.innerText = rem;
endbal.innerText = ((+d.startBalance || 0) + rem);
// حساب الحالة السنوية
// حالة الادخار للشهر الحالي
let savingAmount = (+d.saving || 0);
 if (savingAmount >= 1000){
    status.innerHTML = "🟢 ممتاز";
}
else if (savingAmount >= 500){
    status.innerHTML = "🟡 جيد";
}
else if (savingAmount > 0){
    status.innerHTML = "🟠 مقبول";
}
else{
    status.innerHTML = "🔴 لا يوجد ادخار";
}
 const originalLoan = 19752;
let currentLoan = 19752;
months.forEach(m => {
 let monthData =
 JSON.parse(localStorage.getItem(year.value+"_"+m) || "{}");
 currentLoan -= (+monthData.extraLoan || 0);
});
if(currentLoan < 0) currentLoan = 0;
let paidLoan = originalLoan - currentLoan;
if (paidLoan < 0) paidLoan = 0;
let progress = (paidLoan / originalLoan) * 100;
document.getElementById("loanRemain").innerText =
currentLoan.toFixed(0);
document.getElementById("loanPaid").innerText =
paidLoan.toFixed(0);
document.getElementById("loanProgress").innerText =
progress.toFixed(1) + "%";
}
month.onchange=loadMonth;function printReport(){
window.print();
}
function printYearReport(){
let rows="";
months.forEach(m=>{
let d=JSON.parse(
localStorage.getItem(year.value+"_"+m) || "{}"
);
rows += `
<tr>
<td>${m}</td>
<td>${d.commission || 0}</td>
<td>${d.commitments || 0}</td>
<td>${d.saving || 0}</td>
<td>${d.extraLoan || 0}</td>
</tr>
`;
});
let w=window.open("");
w.document.write(`
<html dir="rtl">
<head>
<title>التقرير السنوي</title>
<style>
body{font-family:Arial;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}
</style>
</head>
<body>
<h1>MALREHN</h1>
<h2>التقرير السنوي ${year.value}</h2>
<table>
<tr>
<th>الشهر</th>
<th>العمولة</th>
<th>الالتزامات</th>
<th>الادخار</th>
<th>القرض</th>
</tr>
${rows}
</table>
<script>
window.print();
<\/script>
</body>
</html>
`);
w.document.close();
}
function resetYear(){
if(!confirm("سيتم حذف جميع بيانات السنة الحالية")) return;
months.forEach(m=>{
localStorage.removeItem(year.value+"_"+m);
});
loadMonth();
refresh();
alert("تم حذف بيانات السنة");
}
year.onchange=loadMonth;
loadMonth();
</script>
</body>
</html>
