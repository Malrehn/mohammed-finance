<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مدير محمد المالي V4</title><style>body{font-family:Arial;background:#f4f6f9;padding:10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.section{background:#fff;padding:12px;border-radius:12px}input,select,button{width:100%;padding:8px;margin:4px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:6px;text-align:center}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><h2>مدير محمد المالي V4</h2><div class="cards"><div class="card">💰<div id="remain">0</div></div><div class="card">🏦<div id="loanCard">0</div></div><div class="card">🎯<div id="saveCard">0</div></div><div class="card">📈<div id="incomeCard">0</div></div></div><div class="section"><select id="month"></select><input id="salary" type="number" value="5900" placeholder="الراتب"><input id="commission" type="number" placeholder="العمولة"><input id="education" type="number" placeholder="التعليم"><input id="fuel" type="number" placeholder="بنزين"><input id="groceries" type="number" placeholder="مقاضي"><input id="restaurants" type="number" placeholder="مطاعم"><input id="other" type="number" placeholder="أخرى"><input id="loanBalance" type="number" value="19752" placeholder="رصيد القرض"><input id="extraLoan" type="number" placeholder="السداد الإضافي"><input id="saving" type="number" placeholder="الادخار"><button onclick="saveData()">حفظ</button><button onclick="window.print()">PDF</button></div><div class="section"><table><thead><tr><th>الشهر</th><th>العمولة</th><th>المصروفات</th><th>الادخار</th></tr></thead><tbody id="history"></tbody></table></div><script>const months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];const m=document.getElementById("month");months.forEach(x=>{let o=document.createElement("option");o.value=x;o.text=x;m.add(o)});m.value=months[new Date().getMonth()];function saveData(){const d={salary:+salary.value||5900,commission:+commission.value||0,education:+education.value||0,fuel:+fuel.value||0,groceries:+groceries.value||0,restaurants:+restaurants.value||0,other:+other.value||0,loanBalance:+loanBalance.value||0,extraLoan:+extraLoan.value||0,saving:+saving.value||0};localStorage.setItem("finance_"+m.value,JSON.stringify(d));refresh()}function loadMonth(){let d=JSON.parse(localStorage.getItem("finance_"+m.value)||"{}");["salary","commission","education","fuel","groceries","restaurants","other","loanBalance","extraLoan","saving"].forEach(id=>{if(d[id]!=null)document.getElementById(id).value=d[id]});refresh()}function refresh(){let annual=0,rows="";months.forEach(mon=>{let d=JSON.parse(localStorage.getItem("finance_"+mon)||"{}");let exp=(+d.education||0)+(+d.fuel||0)+(+d.groceries||0)+(+d.restaurants||0)+(+d.other||0);annual+=(+d.saving||0);rows+=`<tr><td>${mon}</td><td>${d.commission||0}</td><td>${exp}</td><td>${d.saving||0}</td></tr>`});history.innerHTML=rows;let d=JSON.parse(localStorage.getItem("finance_"+m.value)||"{}");let income=(+d.salary||5900)+(+d.commission||0);let exp=(+d.education||0)+(+d.fuel||0)+(+d.groceries||0)+(+d.restaurants||0)+(+d.other||0);incomeCard.innerText=income;remain.innerText=income-exp-(+d.extraLoan||0)-(+d.saving||0)-1646;loanCard.innerText=((+d.loanBalance||0)-1646-(+d.extraLoan||0));saveCard.innerText=annual}m.onchange=loadMonth;loadMonth();</script></body></html>
